name: crowdstrike-wazuh-bridge

services:
  bridge:
    build: .
    container_name: crowdstrike-wazuh-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WAZUH_OUTPUT_PATH: /var/ossec/logs/crowdstrike/crowdstrike-events.json
      PG_HOST: postgres
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./wazuh-runtime/data/wazuh-logs:/var/ossec/logs
    depends_on:
      wazuh.manager:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: crowdstrike-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - ./wazuh-runtime/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.8
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    env_file:
      - ./wazuh-runtime/.env.wazuh
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ./wazuh-runtime/data/wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./wazuh-runtime/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
      - ./wazuh-runtime/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -u admin:$${INDEXER_PASSWORD} https://localhost:9200/_cluster/health | grep -q 'green'"]
      interval: 10s
      timeout: 5s
      retries: 30

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.8
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    env_file:
      - ./wazuh-runtime/.env.wazuh
    ports:
      - "127.0.0.1:1514:1514/tcp"
      - "127.0.0.1:1515:1515/tcp"
      - "127.0.0.1:514:514/udp"
      - "127.0.0.1:55000:55000/tcp"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
    volumes:
      - ./wazuh-runtime/data/wazuh-api-configuration:/var/ossec/api/configuration
      - ./wazuh-runtime/data/wazuh-etc:/var/ossec/etc
      - ./wazuh-runtime/data/wazuh-logs:/var/ossec/logs
      - ./wazuh-runtime/data/wazuh-queue:/var/ossec/queue
      - ./wazuh-runtime/data/wazuh-integrations:/var/ossec/integrations
      - ./wazuh-runtime/data/wazuh-active-response:/var/ossec/active-response/bin
      - ./wazuh-runtime/data/wazuh-agentless:/var/ossec/agentless
      - ./wazuh-runtime/data/wazuh-wodles:/var/ossec/wodles
      - ./wazuh-runtime/data/filebeat-etc:/etc/filebeat
      - ./wazuh-runtime/data/filebeat-var:/var/lib/filebeat
      - ./wazuh-runtime/data/wazuh-var-multigroups:/var/ossec/var/multigroups
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./wazuh-runtime/logs:/var/log/news-portal
      - ./wazuh-rules/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./wazuh-runtime/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.8
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_started
    env_file:
      - ./wazuh-runtime/.env.wazuh
    ports:
      - "127.0.0.1:8443:5601"
    environment:
      WAZUH_API_URL: https://wazuh.manager
    volumes:
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./wazuh-runtime/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./wazuh-runtime/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./wazuh-runtime/data/wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - ./wazuh-runtime/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - ./wazuh-runtime/data/wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
